<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="Ammar Alkazaz, Marketing Growth Strategist">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF9F3"/><stop offset="0.55" stop-color="#F1E8F3"/><stop offset="1" stop-color="#DCCBE1"/></linearGradient>
<linearGradient id="rb1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#BCA7C5"/><stop offset="0.5" stop-color="#64476F"/><stop offset="1" stop-color="#231628"/></linearGradient>
