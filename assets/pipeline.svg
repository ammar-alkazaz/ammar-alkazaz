<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="How I build a growth system">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF9F3"/><stop offset="1" stop-color="#EFE7F1"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#BCA7C5"/><stop offset="1" stop-color="#64476F"/></linearGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="230" rx="18" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="999" height="229" rx="18" fill="none" stroke="#BCA7C5" stroke-opacity="0.6"/>
<text x="500.0" y="36" text-anchor="middle" font-size="12" letter-spacing="3" fill="#64476F">HOW I BUILD A GROWTH SYSTEM</text>
<text x="500.0" y="66" text-anchor="middle" font-size="13" fill="#231628">Humans approve. Machines execute. Every rule lives in the system, not in someone's head.</text>
<path id="flow" d="M 92 118 L 255 118 L 418 118 L 582 118 L 745 118 L 908 118" fill="none" stroke="url(#line)" stroke-width="2" stroke-dasharray="6 7"><animate attributeName="stroke-dashoffset" from="0" to="-52" dur="2.2s" repeatCount="indefinite"/></path>
<circle r="5" fill="#364FCF" filter="url(#glow)"><animateMotion dur="7.2s" begin="0s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
<circle r="4" fill="#41609C" filter="url(#glow)"><animateMotion dur="7.2s" begin="2.4s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
<circle r="4" fill="#64476F" filter="url(#glow)"><animateMotion dur="7.2s" begin="4.8s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion></circle>
<circle cx="92" cy="118" r="27" fill="#FFF9F3" stroke="#BCA7C5" stroke-width="2.2"><animate attributeName="stroke" values="#BCA7C5;#364FCF;#BCA7C5" dur="7.2s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="r" values="27;29;27" dur="7.2s" begin="0.0s" repeatCount="indefinite"/></circle>
<text x="92" y="124" text-anchor="middle" font-size="17" font-weight="600" fill="#231628">1</text>
<text x="92" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#231628">Signals</text>
<text x="92" y="190" text-anchor="middle" font-size="11" fill="#64476F">hiring, funding, site changes</text>
<circle cx="255" cy="118" r="27" fill="#FFF9F3" stroke="#BCA7C5" stroke-width="2.2"><animate attributeName="stroke" values="#BCA7C5;#364FCF;#BCA7C5" dur="7.2s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="r" values="27;29;27" dur="7.2s" begin="1.2s" repeatCount="indefinite"/></circle>
<text x="255" y="124" text-anchor="middle" font-size="17" font-weight="600" fill="#231628">2</text>
<text x="255" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#231628">Score</text>
<text x="255" y="190" text-anchor="middle" font-size="11" fill="#64476F">fit score, versioned rules</text>
<circle cx="418" cy="118" r="27" fill="#FFF9F3" stroke="#BCA7C5" stroke-width="2.2"><animate attributeName="stroke" values="#BCA7C5;#364FCF;#BCA7C5" dur="7.2s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="r" values="27;29;27" dur="7.2s" begin="2.4s" repeatCount="indefinite"/></circle>
<text x="418" y="124" text-anchor="middle" font-size="17" font-weight="600" fill="#231628">3</text>
<text x="418" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#231628">Human gate</text>
<text x="418" y="190" text-anchor="middle" font-size="11" fill="#64476F">AI labels, a person approves</text>
<circle cx="582" cy="118" r="27" fill="#FFF9F3" stroke="#BCA7C5" stroke-width="2.2"><animate attributeName="stroke" values="#BCA7C5;#364FCF;#BCA7C5" dur="7.2s" begin="3.5999999999999996s" repeatCount="indefinite"/><animate attributeName="r" values="27;29;27" dur="7.2s" begin="3.5999999999999996s" repeatCount="indefinite"/></circle>
<text x="582" y="124" text-anchor="middle" font-size="17" font-weight="600" fill="#231628">4</text>
<text x="582" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#231628">Enrich and verify</text>
<text x="582" y="190" text-anchor="middle" font-size="11" fill="#64476F">two-step contact check</text>
<circle cx="745" cy="118" r="27" fill="#FFF9F3" stroke="#BCA7C5" stroke-width="2.2"><animate attributeName="stroke" values="#BCA7C5;#364FCF;#BCA7C5" dur="7.2s" begin="4.8s" repeatCount="indefinite"/><animate attributeName="r" values="27;29;27" dur="7.2s" begin="4.8s" repeatCount="indefinite"/></circle>
<text x="745" y="124" text-anchor="middle" font-size="17" font-weight="600" fill="#231628">5</text>
<text x="745" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#231628">Sequence</text>
<text x="745" y="190" text-anchor="middle" font-size="11" fill="#64476F">cadence, cooldown, opt-out</text>
<circle cx="908" cy="118" r="27" fill="#FFF9F3" stroke="#BCA7C5" stroke-width="2.2"><animate attributeName="stroke" values="#BCA7C5;#364FCF;#BCA7C5" dur="7.2s" begin="6.0s" repeatCount="indefinite"/><animate attributeName="r" values="27;29;27" dur="7.2s" begin="6.0s" repeatCount="indefinite"/></circle>
<text x="908" y="124" text-anchor="middle" font-size="17" font-weight="600" fill="#231628">6</text>
<text x="908" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#231628">Replies</text>
<text x="908" y="190" text-anchor="middle" font-size="11" fill="#64476F">classified, routed, reported</text>
</svg>