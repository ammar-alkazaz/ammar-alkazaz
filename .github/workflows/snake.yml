name: generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate the snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ammar-alkazaz
          outputs: |
            dist/github-snake.svg?color_snake=#364FCF&color_dots=#EFE7F1,#BCA7C5,#8C6E95,#64476F,#231628
            dist/github-snake-dark.svg?color_snake=#BCA7C5&color_dots=#2A1F2E,#4A3552,#64476F,#8C6E95,#BCA7C5

      - name: publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
