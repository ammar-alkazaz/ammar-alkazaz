name: generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate the snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ammar-alkazaz
          outputs: |
            dist/github-snake.svg?color_snake=#364FCF&color_dots=#EFE7F1,#BCA7C5,#8C6E95,#64476F,#231628
            dist/github-snake-dark.svg?color_snake=#BCA7C5&color_dots=#2A1F2E,#4A3552,#64476F,#8C6E95,#BCA7C5

      - name: publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update contribution snake"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
